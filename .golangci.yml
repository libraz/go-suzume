version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/libraz/go-suzume

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - gocritic

  settings:
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - unnamedResult
        - dupImport
        - unnecessaryDefer
        - rangeValCopy

  exclusions:
    rules:
      # Passing a struct that contains pointer fields to C makes cgo rewrite the
      # call into a `_cgoCheckPointer(arg, 0 == 0)` guard. The tautology is in
      # generated code but is reported against the file that made the call.
      - path: bridge\.go
        linters:
          - gocritic
        text: dupSubExpr
